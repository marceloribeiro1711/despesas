<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NiceShot admin</title>
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#12202b;--mute:#5b6b78;--line:#d5dde3;--blue:#1f5fbf;--ball:#d8e24a;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1820;--card:#17232d;--ink:#e8eef2;--mute:#93a4b1;--line:#2a3945;--blue:#6aa2f5;--red:#f2877f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:2}
h1{font-size:18px;margin:0}
nav{display:flex;gap:6px;padding:10px 16px}
nav button{flex:1}
nav button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
main{padding:0 16px 40px;max-width:720px;margin:0 auto}
button,input,select{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer}
button.danger{color:var(--red)}
button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pin{display:inline-block;margin:10px 0 6px;padding:4px 14px;background:var(--ball);color:#1b2200;font:700 34px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;border-radius:6px}
.off{opacity:.55}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
dialog{width:min(560px,94vw);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;font-size:14px;color:var(--mute)}
input[type=text],input[type=number],input[type=password],input[type=date]{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;color:var(--ink);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--line);cursor:pointer}
.grid>div{position:relative}.st{position:absolute;top:2px;right:2px;min-height:30px;width:30px;padding:0;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%}.st.on{color:#ffd84a;background:rgba(0,0,0,.75)}
.grid span{display:block;font-size:11px;color:var(--mute);text-align:center}
.cam{border:1px solid var(--line);border-radius:8px;padding:4px 12px 12px;margin-top:14px}.rng{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#msg{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;display:none;z-index:9}
</style>
</head>
<body>
<header><h1>NiceShot admin <small id="ver" class="mute"></small></h1><button id="cfg" aria-label="Configurar">Configurar</button></header>
<main>
  <div id="events"><button class="primary" id="new" style="width:100%">Novo evento</button><div id="list"></div></div>
</main>

<dialog id="dc"><form method="dialog">
  <b>Conexão</b>
  <label>Endereço do Worker</label><input type="text" id="cu" placeholder="https://niceshot-api.seu-nome.workers.dev" autocapitalize="off">
  <label>Chave de admin</label><input type="password" id="ck" autocomplete="off">
  <label>Pasta do Drive de todos os eventos (link ou ID)</label><input type="text" id="cf" autocapitalize="off">
  <div class="row"><button class="primary" id="cs" value="ok">Salvar</button><button value="x">Cancelar</button></div>
</form></dialog>

<dialog id="de"><form method="dialog">
  <b id="et">Novo evento</b>
  <label>Nome do evento</label><input type="text" id="n">
  <label>Local</label><input type="text" id="pl" placeholder="ex.: Clube, cidade">
  <label>Primeiro dia do evento (fotos a partir das 00:00)</label><input type="date" id="df">
  <label>Último dia do evento (fotos até as 23:59)</label><input type="date" id="dt">
  <label>PIN de acesso (4 dígitos; vazio = gerar automático)</label><input type="text" id="pn" inputmode="numeric" maxlength="4" autocomplete="off">
  <label class="chk"><input type="checkbox" id="a" checked> Permitir baixar as fotos</label>
  <label class="chk"><input type="checkbox" id="l" checked> Aparecer na lista inicial do app</label>
  <div class="row"><button class="primary" id="es" value="ok">Salvar evento</button><button value="x">Cancelar</button></div>
</form></dialog>

<dialog id="dp"><form method="dialog">
  <b id="pt">Fotos</b> <span class="mute" id="pc"></span>
  <p class="mute" style="margin:6px 0 0">Toque na foto para ocultá-la. Toque na estrela para definir a capa (dourada = capa atual; toque nela de novo para tirar). A data sob cada foto é a da captura; ⚠ indica foto sem data gravada.</p>
  <div class="grid" id="pg"></div>
  <div class="row"><button type="button" id="pr">Atualizar lista</button><button value="x">Fechar</button></div>
</form></dialog>

<div id="msg" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const base = () => {
  let u = (localStorage.getItem("ns_url") || "").trim().replace(/\/+$/, "");
  if (u && !/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
};
let events = [], editing = null, pvEv = null;

function say(t) { const m = $("#msg"); m.textContent = t; m.style.display = "block"; clearTimeout(say.t); say.t = setTimeout(() => m.style.display = "none", 3500); }

async function api(path, opt = {}) {
  const r = await fetch(base() + path, { ...opt, headers: { "Content-Type": "application/json", Authorization: "Bearer " + (localStorage.getItem("ns_key") || ""), ...(opt.headers || {}) } });
  let b = {}; try { b = await r.json(); } catch {}
  if (!r.ok) throw new Error(b.error || ("erro " + r.status));
  return b;
}
const put = (id, body) => api("/api/admin/events/" + id, { method: "PUT", body: JSON.stringify(body) });

const NEED = "2026-10-04-c"; // versão do Worker que esta página espera
async function checkVer() {
  try {
    const v = await (await fetch(base() + "/api/health")).json();
    $("#ver").textContent = v.build ? "· Worker " + v.build : "· Worker antigo ⚠";
    if (v.build !== NEED) say("O Worker publicado está desatualizado. Cole o worker.js mais recente em Edit code e faça Deploy.");
  } catch {}
}
async function load() {
  if (!base()) { $("#dc").showModal(); return; }
  checkVer();
  try { events = await api("/api/admin/events"); drawEvents(); }
  catch (e) { $("#list").innerHTML = `<p class="card">Não consegui carregar: ${esc(e.message)}. Confira o endereço e a chave em Configurar.</p>`; }
}

function drawEvents() {
  $("#list").innerHTML = events.length ? events.map(ev => `
    <div class="card ${ev.active ? "" : "off"}" data-id="${ev.id}">
      <div class="top"><b>${esc(ev.name)}</b><span class="mute">${ev.active ? "No ar" : "Desativado"}</span></div>
      <div class="pin">${esc(ev.pin)}</div>
      <div class="mute">${esc(ev.date || "sem data")} · ${esc(daysText(ev))} · download ${ev.allowDownload === false ? "desligado" : "ligado"} · ${ev.cover ? "com capa" : "sem capa"}</div>
      <div class="row">
        <button data-a="photos">Fotos</button><button data-a="edit">Editar</button>
        <button data-a="toggle">${ev.active ? "Desativar" : "Ativar"}</button>
        <button data-a="del" class="danger">Apagar</button>
      </div>
    </div>`).join("") : `<p class="mute">Nenhum evento ainda. Toque em Novo evento.</p>`;
}

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.closest(".card").dataset.id, ev = events.find(x => x.id === id);
  try {
    if (b.dataset.a === "photos") return preview(ev);
    if (b.dataset.a === "edit") return openForm(ev);
    if (b.dataset.a === "toggle") await put(id, { active: !ev.active });
    if (b.dataset.a === "del") { if (!confirm("Apagar o evento " + ev.name + "? As fotos no Drive não são apagadas.")) return; await api("/api/admin/events/" + id, { method: "DELETE" }); }
    await load();
  } catch (err) { say(err.message); }
});

const dmy = d => d ? d.split("-").reverse().join("/") : "";
const daysText = ev => ev.dateFrom && ev.dateTo ? "dias " + dmy(ev.dateFrom) + " a " + dmy(ev.dateTo) : "SEM DATAS: lista a pasta toda, edite o evento";
function openForm(ev) {
  editing = ev || null;
  $("#et").textContent = ev ? "Editar evento" : "Novo evento";
  $("#n").value = ev?.name || "";
  $("#df").value = ev?.dateFrom || ""; $("#dt").value = ev?.dateTo || "";
  $("#a").checked = ev ? ev.allowDownload !== false : true;
  $("#pn").value = ev?.pin || ""; $("#pl").value = ev?.place || "";
  $("#l").checked = ev ? ev.listed !== false : true;
  $("#de").showModal();
}
$("#new").onclick = () => openForm(null);
$("#es").onclick = async e => {
  e.preventDefault();
  const body = { name: $("#n").value.trim(), date: $("#df").value, allowDownload: $("#a").checked, listed: $("#l").checked, place: $("#pl").value.trim(), dateFrom: $("#df").value, dateTo: $("#dt").value };
  const pin = $("#pn").value.trim();
  if (pin) body.pin = pin;
  if (pin && !/^\d{4}$/.test(pin)) return say("O PIN precisa ter 4 dígitos.");
  if (!body.name) return say("Preencha o nome do evento.");
  if (!body.dateFrom || !body.dateTo) return say("Informe o primeiro e o último dia do evento.");
  if (body.dateFrom > body.dateTo) return say("O último dia não pode ser antes do primeiro.");
  const dias = Math.round((new Date(body.dateTo) - new Date(body.dateFrom)) / 864e5) + 1;
  if (dias > 31 && !confirm("O período tem " + dias + " dias e vai listar todas as fotos desse intervalo. Confirma?")) return;
  try {
    if (editing) await put(editing.id, body); else await api("/api/admin/events", { method: "POST", body: JSON.stringify(body) });
    $("#de").close(); say("Evento salvo."); await load();
  } catch (err) { say(err.message); }
};

async function preview(ev) {
  pvEv = ev;
  $("#pt").textContent = ev.name; $("#pc").textContent = "carregando…"; $("#pg").innerHTML = ""; $("#dp").showModal();
  try {
    const { token } = await fetch(base() + "/api/access", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin: ev.pin }) }).then(async r => { const b = await r.json(); if (!r.ok) throw new Error(b.error || r.status); return b; });
    const { photos, event } = await fetch(base() + "/api/photos?token=" + encodeURIComponent(token)).then(async r => { const b = await r.json(); if (!r.ok) throw new Error(b.error || r.status); return b; });
    $("#pc").textContent = photos.length + " fotos · " + (event && event.dateFrom && event.dateTo ? "filtro " + dmy(event.dateFrom) + " a " + dmy(event.dateTo) : "SEM FILTRO DE DATAS");
    $("#pg").innerHTML = photos.length ? photos.map(p => `<div data-f="${p.id}"><button type="button" class="st${p.id === ev.cover ? " on" : ""}" data-s="${p.id}" aria-label="Definir como capa">${p.id === ev.cover ? "★" : "☆"}</button><img loading="lazy" alt="${esc(p.name)}" src="${base()}/api/thumb/${p.id}?s=400&k=${p.k}&token=${encodeURIComponent(token)}"><span title="${esc(p.name)}">${p.exif ? "" : "⚠ "}${esc((p.takenAt || "").slice(0, 16).replace("T", " "))}</span></div>`).join("") : `<p class="mute">Nenhuma foto encontrada com esse prefixo e número inicial. Confira a pasta e o compartilhamento no Drive.</p>`;
    $("#pg").onclick = async e => {
      const s = e.target.closest("[data-s]");
      if (s) {
        const next = ev.cover === s.dataset.s ? "" : s.dataset.s;
        try {
          await put(ev.id, { cover: next }); ev.cover = next; say(next ? "Capa definida." : "Capa removida.");
          document.querySelectorAll("#pg .st").forEach(b => { const on = b.dataset.s === ev.cover; b.classList.toggle("on", on); b.textContent = on ? "★" : "☆"; });
        } catch (err) { say(err.message); }
        return;
      }
      const d = e.target.closest("[data-f]"); if (!d || !confirm("Ocultar esta foto do álbum?")) return;
      try { await put(ev.id, { hideFile: d.dataset.f }); d.remove(); say("Foto oculta."); } catch (err) { say(err.message); }
    };
  } catch (err) { $("#pc").textContent = ""; $("#pg").innerHTML = `<p class="mute">${esc(err.message)}</p>`; }
}

$("#cfg").onclick = () => {
  $("#cu").value = base(); $("#ck").value = localStorage.getItem("ns_key") || ""; $("#cf").value = ""; $("#dc").showModal();
  if (base()) api("/api/admin/settings").then(s => { $("#cf").value = s.folderId || ""; }).catch(() => {});
};
$("#cs").onclick = async e => {
  e.preventDefault(); localStorage.setItem("ns_url", $("#cu").value.trim()); localStorage.setItem("ns_key", $("#ck").value);
  const f = $("#cf").value.trim();
  if (f) { try { await api("/api/admin/settings", { method: "PUT", body: JSON.stringify({ folderId: f }) }); say("Pasta do Drive salva."); } catch (err) { say(err.message); } }
  $("#dc").close(); load();
};
$("#pr").onclick = async () => {
  if (!pvEv) return;
  try { await put(pvEv.id, {}); await preview(pvEv); say("Lista atualizada."); } catch (err) { say(err.message); }
};
$("#df").onchange = () => { if (!$("#dt").value || $("#dt").value < $("#df").value) $("#dt").value = $("#df").value; };
load();
</script>
</body>
</html>
